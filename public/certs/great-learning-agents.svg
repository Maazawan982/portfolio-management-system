<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%">
  <!-- Background Canvas -->
  <rect width="1000" height="680" fill="#FFFDF8" rx="12" />
  
  <!-- Outer Border -->
  <rect x="25" y="25" width="950" height="630" fill="none" stroke="#E2E8F0" stroke-width="2" rx="8" />

  <!-- Top Left: Great Learning Logo -->
  <g transform="translate(60, 60)">
    <!-- Blue Chevron G Logo -->
    <path d="M 30 10 A 20 20 0 1 0 45 40 L 32 40 A 10 10 0 1 1 30 20 Z" fill="#0284C7" />
    <path d="M 45 25 L 35 35 L 45 45" fill="none" stroke="#0284C7" stroke-width="3" stroke-linecap="round" />
    <text x="55" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#0C4A6E">
      Great
    </text>
    <text x="55" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="600" fill="#0369A1">
      Learning
    </text>
  </g>

  <!-- Title: CERTIFICATE OF COMPLETION -->
  <g transform="translate(60, 160)">
    <text x="0" y="0" font-family="Georgia, serif" font-size="36" font-weight="bold" fill="#0F172A" letter-spacing="1">
      CERTIFICATE OF COMPLETION
    </text>
    <text x="0" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#64748B">
      Presented to
    </text>
    <text x="0" y="105" font-family="Georgia, serif" font-size="44" font-weight="bold" fill="#0369A1">
      Maaz Nadeem
    </text>
    <text x="0" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#64748B">
      For successfully completing an online course
    </text>
    <text x="0" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#0F172A">
      Building Intelligent AI Agents
    </text>
    <text x="0" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#334155">
      Course completed on <tspan font-weight="600">July 22, 2026</tspan>
    </text>
  </g>

  <!-- Signature Line -->
  <g transform="translate(60, 520)">
    <path d="M 0 25 Q 30 -5 60 20 T 110 15 T 150 25" fill="none" stroke="#0F172A" stroke-width="2.5" />
    <line x1="0" y1="35" x2="220" y2="35" stroke="#94A3B8" stroke-width="1.5" />
    <text x="0" y="55" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#0F172A">Harish Subramanian</text>
    <text x="0" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748B">Academic Director, Great Learning</text>
  </g>

  <!-- Right Side: Blue & Gold Ribbon Badge -->
  <g transform="translate(860, 240)">
    <!-- Ribbon Tails -->
    <polygon points="-25,70 -35,160 0,130 35,160 25,70" fill="#0284C7" />
    <!-- Medal Circle -->
    <circle cx="0" cy="40" r="65" fill="#D97706" />
    <circle cx="0" cy="40" r="58" fill="#F59E0B" />
    <circle cx="0" cy="40" r="54" fill="#0284C7" />
    <text x="0" y="30" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#FEF3C7" letter-spacing="1">VERIFYING ONLINE</text>
    <text x="0" y="58" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF">G</text>
    <text x="0" y="74" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#FEF3C7" letter-spacing="1">CERTIFICATE</text>
  </g>

  <!-- QR Code Representation -->
  <g transform="translate(815, 490)">
    <rect x="0" y="0" width="90" height="90" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="4" />
    <rect x="10" y="10" width="25" height="25" fill="#0F172A" />
    <rect x="15" y="15" width="15" height="15" fill="#FFFFFF" />
    <rect x="55" y="10" width="25" height="25" fill="#0F172A" />
    <rect x="60" y="15" width="15" height="15" fill="#FFFFFF" />
    <rect x="10" y="55" width="25" height="25" fill="#0F172A" />
    <rect x="15" y="60" width="15" height="15" fill="#FFFFFF" />
    <rect x="42" y="42" width="12" height="12" fill="#0F172A" />
    <rect x="60" y="60" width="15" height="15" fill="#0F172A" />
    <text x="45" y="105" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#64748B">Scan to Verify</text>
  </g>
</svg>