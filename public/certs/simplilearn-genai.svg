  </text>

  <!-- Recipient Name -->
  <text x="500" y="325" text-anchor="middle" font-family="Georgia, serif" font-size="42" font-weight="bold" fill="#0F172A">
    Maaz Nadeem
  </text>
  <line x1="250" y1="345" x2="750" y2="345" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4,4" />

  <text x="500" y="380" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#475569">
    has successfully completed the online course:
  </text>

  <!-- Course Name -->
  <text x="500" y="435" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#0369A1">
    Introduction to Generative AI
  </text>

  <text x="500" y="490" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#64748B">
