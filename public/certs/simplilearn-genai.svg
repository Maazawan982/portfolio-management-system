  </text>

  <!-- Date & Certificate Code -->
  <g transform="translate(70, 560)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#0F172A">
