    </text>
    <text x="0" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#475569">
      Certificate code : <tspan font-weight="700" fill="#0F172A">10534240</tspan>
    </text>
  </g>

  <!-- Krishna Kumar Signature -->
  <g transform="translate(800, 530)">
    <path d="M 0 25 Q 30 -5 50 30 T 90 10 T 120 20" fill="none" stroke="#0F172A" stroke-width="2.5" />
    <line x1="-20" y1="40" x2="140" y2="40" stroke="#94A3B8" stroke-width="1.5" />
    <text x="60" y="60" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#0F172A">Krishna Kumar</text>
    <text x="60" y="76" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748B">CEO, Simplilearn</text>
