<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%">
  <!-- Background Canvas -->
  <rect width="1000" height="680" fill="#FFFFFF" rx="12" />
  
  <!-- Outer Elegant Border -->
  <rect x="25" y="25" width="950" height="630" fill="none" stroke="#CBD5E1" stroke-width="1.5" rx="8" />

  <!-- Top Bar: Powered by Google Cloud (Left) & Simplilearn SkillUp (Right) -->
  <g transform="translate(60, 60)">
    <text x="0" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748B">Powered by</text>
    <text x="0" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700">
      <tspan fill="#4285F4">G</tspan><tspan fill="#EA4335">o</tspan><tspan fill="#FBBC05">o</tspan><tspan fill="#4285F4">g</tspan><tspan fill="#34A853">l</tspan><tspan fill="#EA4335">e</tspan> <tspan fill="#475569" font-weight="600">Cloud</tspan>
    </text>
  </g>

  <g transform="translate(940, 60)">
    <text x="0" y="32" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800">
      <tspan fill="#EA580C">simpli</tspan><tspan fill="#0284C7">learn</tspan> <tspan fill="#2563EB" font-weight="900">SkillUP</tspan>
    </text>
  </g>

  <!-- Title: DECLARATION OF COMPLETION -->
  <text x="500" y="195" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#64748B" letter-spacing="4">
    DECLARATION OF
  </text>
  <text x="500" y="245" text-anchor="middle" font-family="Georgia, serif" font-size="44" font-weight="bold" fill="#1E293B" letter-spacing="2">
